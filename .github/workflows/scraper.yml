name: Autonomous Quant Engine

on:
  schedule:
    - cron: '0 6 * * *'   # 8:00 AM CAT: Run the Scraper (Find Bets)
    - cron: '0 22 * * *'  # 12:00 AM CAT: Run the Settler (Grade Bets)

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Run Scraper (Morning)
        if: github.event.schedule == '0 6 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
        
      - name: Run Settler (Night)
        if: github.event.schedule == '0 22 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python settler.py